[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-data-engineering"
version = "0.1.0"
description = "Dual-twin metamodel foundation for the Agentic Data Engineering Evolution Platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
neo4j = ["neo4j>=5.14"]
postgres = ["psycopg[binary]>=3.1"]
agent = ["anthropic>=0.40"]
web = ["fastapi>=0.110", "uvicorn>=0.27", "jinja2>=3.1", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "domain*",
    "persistence*",
    "engines*",
    "project_graph*",
    "discovery*",
    "orchestrator*",
    "agent_runtime*",
    "webui*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires a live Neo4j or PostgreSQL instance",
    "agent_integration: requires a live LLM provider (ANTHROPIC_API_KEY, or the copilot/gh CLI on PATH)",
]
filterwarnings = ["error::DeprecationWarning"]
